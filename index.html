<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Body OS">
  <title>Body OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- база продуктов (≈730 КБ) качается параллельно с модулями, а не после них; забирает js/data/foodseed.js.
       Не <link rel=preload>: под service worker Chrome такой preload не отдаёт fetch() -->
  <script>
    window.__bodyosSeed = Promise.all(['data/foods_seed.json', 'data/aliases.json'].map((p) =>
      fetch(p).then((r) => (r.ok ? r.json() : Promise.reject(new Error(p + ': ' + r.status))))));
  </script>
  <link rel="modulepreload" href="js/core/foods.js">
  <link rel="modulepreload" href="js/core/fooddb.js">
  <link rel="modulepreload" href="js/data/foodseed.js">
  <link rel="modulepreload" href="js/app/services.js">
</head>
<body>
  <div id="app"><p class="muted">Загрузка…</p></div>
  <nav class="tabs" id="tabs" hidden>
    <a href="#/" data-r="">Сегодня</a>
    <a href="#/train" data-r="train">Тренировка</a>
    <a href="#/week" data-r="week">Неделя</a>
    <a href="#/labs" data-r="labs">Анализы</a>
    <a href="#/more" data-r="more">Ещё</a>
  </nav>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
